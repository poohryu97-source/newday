name: 많이 본 뉴스 업데이트
on:
  schedule:
    - cron: "16 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: 기사·사진 받기
        run: |
          rm -rf out
          timeout 600 python3 -I tools/update.py out 30 30 news.json
          python3 -c "import json;d=json.load(open('out/news.json'));n=len(d['items']);print(n,'articles');assert n>=20"
      - name: 사이트 파일 교체
        run: |
          mkdir -p img
          cp -n out/img/* img/ 2>/dev/null || true
          cp news.json prev.json 2>/dev/null || echo '{"items":[]}' > prev.json
          mv out/news.json news.json
          # 이번 + 지난 업데이트에서 쓰는 사진만 남기고 정리 (예전 화면을 보고 있는 사람도 사진이 깨지지 않게)
          python3 -c "import json,os;u={i['img'].split('/')[1] for f in ('news.json','prev.json') for i in json.load(open(f)).get('items',[]) if i.get('img')};[os.remove('img/'+x) for x in os.listdir('img') if x not in u]"
          rm -rf out prev.json
      - name: 저장
        run: |
          git config user.name "newday-bot"
          git config user.email "newday-bot@users.noreply.github.com"
          git add -A news.json img
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "뉴스 업데이트 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          git push
