<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0605">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>뉴데이 뉴스</title>
<style>html,body{margin:0;background:#0b0605}</style>
</head>
<body>
<script>
// 항상 최신 디자인을 보여주기 위해 본문(main.html)을 매번 새로 불러온다
fetch('main.html?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(h){document.open();document.write(h);document.close()}).catch(function(){location.replace('main.html?t='+Date.now())});
</script>
</body>
</html>
