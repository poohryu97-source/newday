name: 많이 본 뉴스 업데이트
on:
  schedule:
    - cron: "16 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: 기사·사진 받기
        run: |
          rm -rf out
          timeout 600 python3 -I tools/update.py out 30 15
          python3 -c "import json;d=json.load(open('out/news.json'));n=len(d['items']);print(n,'articles');assert n>=20"
      - name: 사이트 파일 교체
        run: |
          rm -rf img
          mv out/img img
          mv out/news.json news.json
          rm -rf out
      - name: 저장
        run: |
          git config user.name "newday-bot"
          git config user.email "newday-bot@users.noreply.github.com"
          git add -A news.json img
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "뉴스 업데이트 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          git push
